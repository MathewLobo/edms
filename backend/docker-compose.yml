services:
  webserver:
    build:
      context: .                        # root — so Dockerfile can see both folders
      dockerfile: webserver/Dockerfile  # explicit path since context is root
    ports:
      - "3000:3000"
    volumes:
      - ./webserver/data:/app/data
      - webserver-data:/app/edms_data
      - edms-root:/app/edms_root
    environment:
      - RUST_LOG=info
      - EDMS_DB_PATH=/app/data/edms.db
      # Pin the storage root to where the volume below is actually
      # mounted — without this the app resolves it to /edms_root at
      # runtime and the edms-root volume persists nothing.
      - EDMS_ROOT=/app/edms_root

  # Per Ravi (2026-09-08): one command, both images — clone the repo, run
  # compose, the app shows up. Frontend's own JS talks to the backend
  # directly via a hardcoded http://localhost:3000 (see testview.js), so
  # no internal Docker network wiring is needed here — both containers
  # just need their ports published to the host.
  frontend:
    build:
      context: ../frontend-app
      dockerfile: dockerfile
    ports:
      - "3911:80"
    depends_on:
      - webserver

volumes:
  webserver-data:
  edms-root: