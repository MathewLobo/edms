services:
  webserver:
    build:
      context: ../backend
      dockerfile: webserver/Dockerfile
    container_name: webserver
    ports:
      - "3000:3000"
    volumes:
      - ../backend/webserver/data:/app/data
      - webserver-data:/app/edms_data
      - edms-root:/app/edms_root
    environment:
      - RUST_LOG=info
      - EDMS_DB_PATH=/app/data/edms.db
      # Pin the storage root to where the edms-root volume is mounted —
      # without this the app resolves it to /edms_root at runtime and the
      # volume below persists nothing (issue #31).
      - EDMS_ROOT=/app/edms_root
    networks:
      - hashedtokens-edms

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: edms-frontend
    ports:
      - "3911:80"  # per the folder-schema doc — open localhost:3911 for the UI
    depends_on:
      - webserver
    networks:
      - hashedtokens-edms

  # First-boot demo data. Runs once on `docker compose up`, then exits
  # (you'll see it as "Exited (0)" in `docker compose ps` — that's
  # expected). It's idempotent: if the backend already has endpoints it
  # does nothing. Talks only to the API, so it never touches the DB or
  # storage layout directly.
  seed:
    image: node:22-alpine
    depends_on:
      - webserver
    environment:
      - EDMS_BASE=http://webserver:3000
    volumes:
      - ./seed.mjs:/seed.mjs:ro
    command: node /seed.mjs
    restart: "no"
    networks:
      - hashedtokens-edms

networks:
  hashedtokens-edms:
    name: hashedtokens-edms
    driver: bridge

volumes:
  webserver-data:
  edms-root: