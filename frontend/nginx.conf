server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    location = / {
    return 301 $scheme://$http_host/pages/index.html;
}

    location / {
        try_files $uri $uri/ =404;
    }
    # Frontend API helper JS — serve as a static file
    location = /api/edms-api.js {
        try_files $uri =404;
    }


    # Reverse proxy to the backend. "webserver" is the compose service /
    # container name; Docker's embedded DNS (127.0.0.11) resolves it.
    #
    # The resolver + variable form is deliberate: with a literal hostname
    # in proxy_pass, nginx resolves it once at STARTUP and refuses to boot
    # (`[emerg] host not found in upstream`) if the backend container
    # isn't registered yet — which it reliably isn't on the first
    # `docker compose up`, even with container_name + depends_on (issue
    # #31, reproduced 2026-09-10). Resolving via a variable defers the
    # lookup to request time, so nginx always starts; if the backend is
    # down, /api/ calls just get a 502 instead of the whole frontend
    # failing to come up.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $edms_backend "webserver:3000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$edms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}